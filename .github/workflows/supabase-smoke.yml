name: KREISLAUF – Datenbanktests (lokal, ohne Passwort)

on:
  workflow_dispatch:
  push:
    branches:
      - demo/local-auth-off
    paths:
      - .github/workflows/supabase-smoke.yml
      - scripts/db-migrations.test.mjs
      - migrations/**

permissions:
  contents: read

jobs:
  local-database-test:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          ref: demo/local-auth-off
      - name: Node.js einrichten
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Abhängigkeiten installieren
        run: npm ci --no-audit --no-fund
      - name: PostgreSQL-Migrationen in temporärer Testdatenbank prüfen
        run: node --test scripts/db-migrations.test.mjs
