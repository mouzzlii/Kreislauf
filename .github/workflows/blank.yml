name: KREISLAUF – Build und Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Node.js einrichten
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: KREISLAUF-v2-Archiv entpacken
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/kreislauf-source
          unzip -q kreislauf-v2.zip -d /tmp/kreislauf-source
          test -f /tmp/kreislauf-source/kreislauf_work/package.json
          rsync -a \
            --exclude='.vercel/' \
            --exclude='.tanstack/' \
            --exclude='node_modules/' \
            --exclude='dist/' \
            /tmp/kreislauf-source/kreislauf_work/ ./
          test -f package.json
          test -d src

      - name: Entpackte Projektdateien im Repository sichern
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- . ':!.github' ':!README.md' ':!kreislauf-v2.zip'
          if ! git diff --cached --quiet; then
            git commit -m "Add complete KREISLAUF v2 project support files"
            git push origin HEAD:main
          else
            echo "Projektdateien sind bereits aktuell."
          fi

      - name: Abhängigkeiten installieren
        id: install
        run: npm ci --no-audit --no-fund

      - name: TypeScript prüfen
        id: typecheck
        run: npm run typecheck

      - name: Automatisierte Tests
        id: tests
        run: npm test

      - name: Code-Qualität prüfen
        if: ${{ always() && steps.install.outcome == 'success' && steps.typecheck.outcome == 'success' }}
        run: npm run lint

      - name: Produktions-Build erstellen
        if: ${{ always() && steps.install.outcome == 'success' && steps.typecheck.outcome == 'success' }}
        run: npm run build:dev
