name: KREISLAUF – Netlify Nitro validation

on:
  push:
    branches:
      - infra/netlify-nitro-validation-2026-11-28
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: netlify-nitro-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  netlify-nitro-build:
    name: Netlify Nitro build (no deployment)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v5

      - name: Node.js einrichten
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci --no-audit --no-fund

      - name: Buildskript syntaktisch prüfen
        run: node --check scripts/build-netlify.mjs

      - name: TypeScript prüfen
        run: npm run typecheck

      - name: Automatisierte Tests
        run: npm test

      - name: Code-Qualität prüfen
        run: npm run lint

      - name: Netlify Nitro Build ausführen
        run: npm run build:netlify
        env:
          # Intentionally no DATABASE_URL or production secrets in this validation.
          CI: "true"

      - name: Netlify Nitro-Ausgabe prüfen
        shell: bash
        run: |
          set -euo pipefail
          test -d dist
          test -s .netlify/functions-internal/server/server.mjs
          grep -R -q "__grok/manifest.webmanifest" .netlify/functions-internal
          echo "Netlify legacy Functions output and KREISLAUF PWA middleware found."

      - name: Netlify Function Request Smoke Test
        run: node scripts/smoke-netlify-build.mjs

      - name: Vorherige Build-Ausgabe entfernen
        run: rm -rf .netlify dist

      - name: Nitro RC in Package und Lockfile übernehmen (Test-Worktree)
        run: npm install --save-exact --no-audit --no-fund --maxsockets=2 nitro@3.0.261103-rc

      - name: Nitro RC-Version und Lockfile-Diff prüfen
        run: |
          node -e "if (require('./node_modules/nitro/package.json').version !== '3.0.261103-rc') process.exit(1)"
          npm ls nitro --depth=0
          git diff --check -- package.json package-lock.json
          git diff --stat -- package.json package-lock.json

      - name: TypeScript mit Nitro RC prüfen
        run: npm run typecheck

      - name: Automatisierte Tests mit Nitro RC
        run: npm test

      - name: Code-Qualität mit Nitro RC prüfen
        run: npm run lint

      - name: Aktuellen Nitro RC für Netlify bauen
        run: npm run build:netlify
        env:
          CI: "true"

      - name: Neues Netlify Frameworks-API-Ausgabeformat prüfen
        shell: bash
        run: |
          set -euo pipefail
          test -d dist
          test -s .netlify/v1/functions/server/server.mjs
          grep -R -q "__grok/manifest.webmanifest" .netlify/v1/functions
          echo "Nitro RC Frameworks API output and KREISLAUF PWA middleware found."

      - name: Nitro RC Function Request Smoke Test
        run: node scripts/smoke-netlify-build.mjs

      - name: Nitro RC Lockfiles als Review-Artefakt sichern
        run: |
          mkdir -p netlify-nitro-lockfiles
          cp package.json package-lock.json netlify-nitro-lockfiles/

      - name: Nitro RC Lockfiles hochladen
        uses: actions/upload-artifact@v4
        with:
          name: netlify-nitro-rc-lockfiles
          path: netlify-nitro-lockfiles/
          if-no-files-found: error
          retention-days: 1
