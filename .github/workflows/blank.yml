name: KREISLAUF – Build und Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kreislauf-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Node.js einrichten
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Abhängigkeiten installieren
        id: install
        run: npm ci --no-audit --no-fund

      - name: TypeScript prüfen
        id: typecheck
        run: npm run typecheck

      - name: Automatisierte Tests
        id: tests
        run: npm test

      - name: Code-Qualität prüfen
        if: ${{ always() && steps.install.outcome == 'success' && steps.typecheck.outcome == 'success' }}
        run: npm run lint

      - name: Produktions-Build erstellen
        if: ${{ always() && steps.install.outcome == 'success' && steps.typecheck.outcome == 'success' }}
        run: npm run build:dev
