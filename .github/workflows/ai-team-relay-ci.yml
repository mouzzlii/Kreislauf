name: KI-Team-Relay CI
# Checks the configured canonical repositories, explicit provider models, and bounded daily usage.

on:
  push:
    branches:
      - chore/ai-team-communication-foundation
      - feature/portfolio-council-routing
      - feature/ai-team-ki-arbeitsplatz-routing
    paths:
      - "scripts/ai-team-interop.mjs"
      - "scripts/ai-team-interop.test.mjs"
      - "scripts/ai-team-ledger.mjs"
      - "scripts/ai-team-ledger.test.mjs"
      - "scripts/ai-team-relay.mjs"
      - "scripts/ai-team-relay.test.mjs"
      - "scripts/ai-team-source-context.mjs"
      - "scripts/ai-team-source-context.test.mjs"
      - "scripts/ai-team-providers.mjs"
      - "scripts/ai-team-providers.test.mjs"
      - ".github/workflows/ai-team-communication.yml"
      - ".github/workflows/ai-team-relay-ci.yml"
      - "AI_TEAM_SETUP.md"
      - "docs/PROJECT-COORDINATION.md"
  pull_request:
    paths:
      - "scripts/ai-team-interop.mjs"
      - "scripts/ai-team-interop.test.mjs"
      - "scripts/ai-team-ledger.mjs"
      - "scripts/ai-team-ledger.test.mjs"
      - "scripts/ai-team-relay.mjs"
      - "scripts/ai-team-relay.test.mjs"
      - "scripts/ai-team-source-context.mjs"
      - "scripts/ai-team-source-context.test.mjs"
      - "scripts/ai-team-providers.mjs"
      - "scripts/ai-team-providers.test.mjs"
      - ".github/workflows/ai-team-communication.yml"
      - ".github/workflows/ai-team-relay-ci.yml"
      - "AI_TEAM_SETUP.md"
      - "docs/PROJECT-COORDINATION.md"

permissions:
  contents: read

jobs:
  syntax-and-parser-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check scripts/ai-team-interop.mjs
          node --check scripts/ai-team-ledger.mjs
          node --check scripts/ai-team-relay.mjs
          node --check scripts/ai-team-source-context.mjs
          node --check scripts/ai-team-providers.mjs
      - name: Test council task envelope validation
        run: node --test scripts/ai-team-interop.test.mjs
      - name: Test trusted relay ledger
        run: node --test scripts/ai-team-ledger.test.mjs
      - name: Test bounded source context
        run: node --test scripts/ai-team-source-context.test.mjs
      - name: Test GPT, Claude, Gemini and Grok Gateway contracts
        run: node --test scripts/ai-team-providers.test.mjs
      - name: Test command parser
        run: node scripts/ai-team-relay.test.mjs
      - name: Verify safe project mapping and daily cap
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";
          import { getMissingProviderConfiguration } from "./scripts/ai-team-providers.mjs";
          const source = readFileSync("scripts/ai-team-relay.mjs", "utf8");
          const setup = readFileSync("AI_TEAM_SETUP.md", "utf8");
          const workflow = readFileSync(".github/workflows/ai-team-communication.yml", "utf8");
          assert.ok(source.includes('TRAKUNA: process.env.PROJECT_REPO_TRAKUNA || "mouzzlii/multi-carrier-gateway"'));
          assert.ok(source.includes('"SCAN-PROFIT": process.env.PROJECT_REPO_SCAN_PROFIT || "mouzzlii/SCAN-PROFIT"'));
          assert.ok(source.includes('"INSERAT-PROFI-AI": process.env.PROJECT_REPO_INSERAT_PROFI_AI || "mouzzlii/INSERAT-PROFI-AI"'));
          assert.ok(source.includes('"BOOK-YOUR-COOK": process.env.PROJECT_REPO_BOOK_YOUR_COOK || "mouzzlii/book-your-cook"'));
          assert.ok(source.includes('"LARA-QUIZ": process.env.PROJECT_REPO_LARA_QUIZ || "mouzzlii/Lara_Quiz"'));
          assert.ok(workflow.includes("PROJECT_REPO_INSERAT_PROFI_AI"));
          assert.ok(workflow.includes("PROJECT_REPO_BOOK_YOUR_COOK"));
          assert.ok(workflow.includes("PROJECT_REPO_LARA_QUIZ"));
          assert.ok(source.includes("getMissingProviderConfiguration({"));
          const incomplete = getMissingProviderConfiguration({});
          assert.deepEqual(incomplete, {
            missingSecrets: ["AI_GATEWAY_API_KEY", "AI_TEAM_REPO_READ_TOKEN"],
            missingVariables: [],
            missingModels: [],
          });
          const complete = getMissingProviderConfiguration({
            AI_GATEWAY_API_KEY: "test-gateway",
            AI_TEAM_REPO_READ_TOKEN: "test-readonly",
          });
          assert.deepEqual(complete, { missingSecrets: [], missingVariables: [], missingModels: [] });
          assert.ok(source.includes('COUNCIL_MODELS.gpt'));
          assert.ok(source.includes('COUNCIL_MODELS.claude'));
          assert.ok(source.includes('COUNCIL_MODELS.gemini'));
          assert.ok(source.includes('COUNCIL_MODELS.grok'));
          assert.ok(workflow.includes("AI_GATEWAY_API_KEY"));
          assert.ok(setup.includes("Vercel AI Gateway"));
          assert.ok(setup.includes("Gemini"));
          assert.ok(setup.includes("Grok"));
          assert.ok(source.includes("MAX_DAILY_DEBATES = 2"));
          assert.ok(source.includes('reserveDailyDebate(comment.id, taskEnvelope?.idempotencyKey || "")'));
          assert.ok(source.includes("parseCouncilTaskComment(comment.body)"));
          assert.ok(source.includes("resolveCouncilTaskProject(taskEnvelope, PROJECT_REPOS)"));
          assert.ok(source.includes("taskEnvelope.payload.inputs.commitSha"));
          assert.ok(source.includes("taskEnvelope.payload.constraints.allowedPaths"));
          assert.ok(source.includes("issue.number !== 11"));
          assert.ok(source.includes("hasSourceExcerpt: hasNonEmptySourceExcerpt(source)"));
          assert.ok(source.includes("hasUsablePrimaryContext(projectContext)"));
          assert.ok(source.includes("KI-Team-Debatte abgebrochen"));
          assert.ok(source.includes("Fehlerphase: ${phase}"));
          assert.ok(source.includes("Tageskontingent bleibt verbraucht"));
          assert.ok(source.includes("issues/11/comments?per_page=100&sort=created&direction=desc"));
          assert.ok(workflow.includes("group: ai-team-global-budget"));
          assert.ok(setup.includes("Maximal zwei Debatten pro UTC-Kalendertag"));
          console.log("Project mapping and daily invocation cap verified.");
          NODE
