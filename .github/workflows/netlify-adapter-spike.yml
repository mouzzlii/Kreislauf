name: Netlify TanStack adapter spike

on:
  push:
    branches:
      - infra/netlify-tanstack-adapter-spike-2026-11-28
    paths-ignore:
      - package-lock.json

permissions:
  contents: write

jobs:
  adapter-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated spike branch
        uses: actions/checkout@v5
        with:
          ref: infra/netlify-tanstack-adapter-spike-2026-11-28

      - name: Set up Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Resolve adapter and refresh lockfile
        run: npm install --package-lock-only --no-audit --no-fund

      - name: Install exact locked dependencies
        run: npm ci --no-audit --no-fund

      - name: TypeScript
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: ESLint
        run: npm run lint

      - name: Existing Vercel build remains intact
        run: npm run build:dev

      - name: Official Netlify TanStack Start build
        env:
          KREISLAUF_NETLIFY_ADAPTER: "1"
        run: npm run build:dev

      - name: Inspect generated deployment output
        run: |
          echo "=== dist ==="
          find dist -maxdepth 4 -type f | sort | head -n 120
          echo "=== .netlify ==="
          if [ -d .netlify ]; then find .netlify -maxdepth 6 -type f | sort | head -n 160; else echo "No .netlify directory"; fi

      - name: Commit reproducible lockfile
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: lock official Netlify TanStack adapter"
            git push origin HEAD:infra/netlify-tanstack-adapter-spike-2026-11-28
          fi
