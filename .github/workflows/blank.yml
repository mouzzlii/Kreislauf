name: KREISLAUF – Build und Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Node.js einrichten
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Abhängigkeiten installieren und Lockfile abgleichen
        id: install
        run: npm install --no-audit --no-fund --fetch-retries=1 --fetch-timeout=30000
      - name: Sichere transitive Updates auflösen
        run: npm audit fix --package-lock-only --ignore-scripts --no-fund --fetch-retries=1 --fetch-timeout=30000
      - name: Abhängigkeiten auf bekannte Sicherheitslücken prüfen
        id: audit
        run: npm audit --audit-level=high
      - name: TypeScript prüfen
        if: ${{ always() && steps.install.outcome == 'success' && steps.build.outcome == 'success' }}
        id: typecheck
        run: npm run typecheck
      - name: Automatisierte Tests
        if: ${{ always() && steps.install.outcome == 'success' && steps.typecheck.outcome == 'success' }}
        id: tests
        run: npm test
      - name: Code-Qualität prüfen
        if: ${{ always() && steps.install.outcome == 'success' && steps.typecheck.outcome == 'success' }}
        run: npm run lint
      - name: Produktions-Build erstellen
        