name: Netlify TanStack adapter spike

on:
  push:
    branches:
      - infra/netlify-tanstack-adapter-spike-2026-11-28
    paths-ignore:
      - package-lock.json

permissions:
  contents: write

concurrency:
  group: netlify-adapter-spike-${{ github.ref }}
  cancel-in-progress: true

jobs:
  adapter-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated spike branch
        uses: actions/checkout@v5
        with:
          ref: infra/netlify-tanstack-adapter-spike-2026-11-28

      - name: Set up Node.js 22 (npm 10 lockfile compatibility)
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Resolve adapter and refresh lockfile
        run: npm install --package-lock-only --no-audit --no-fund

      - name: Install exact locked dependencies
        run: npm ci --no-audit --no-fund

      - name: TypeScript
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: ESLint
        run: npm run lint

      - name: Existing Vercel build remains intact
        run: npm run build:dev

      - name: Official Netlify TanStack Start build
        env:
          KREISLAUF_NETLIFY_ADAPTER: "1"
        run: npm run build:dev

      - name: Inspect generated deployment output
        run: |
          echo "=== dist ==="
          find dist -maxdepth 4 -type f | sort | head -n 120
          echo "=== .netlify ==="
          if [ -d .netlify ]; then find .netlify -maxdepth 6 -type f | sort | head -n 160; else echo "No .netlify directory"; fi

      - name: Commit reproducible lockfile
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: lock official Netlify TanStack adapter"
            git push origin HEAD:infra/netlify-tanstack-adapter-spike-2026-11-28
          fi

      - name: Smoke-test Netlify PWA middleware in local emulation
        env:
          KREISLAUF_NETLIFY_ADAPTER: "1"
          NETLIFY: "true"
          KREISLAUF_SKIP_PGLITE_BOOTSTRAP: "1"
        run: |
          npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/netlify-vite.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if curl --connect-timeout 1 --max-time 2 -fsS http://127.0.0.1:4173/__grok/manifest.webmanifest >/tmp/manifest.json; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/netlify-vite.log
            exit 1
          fi
          grep -q '"short_name"' /tmp/manifest.json
          curl --max-time 10 -fsS -H 'Accept: text/html' -H 'x-forwarded-host: kreislauf.grok.me' 'http://127.0.0.1:4173/?install=1&platform=ios' > /tmp/install.html
          grep -q 'Add KREISLAUF to your' /tmp/install.html
          curl --max-time 15 -fsS -H 'Accept: text/html' -H 'x-forwarded-host: kreislauf.grok.me' http://127.0.0.1:4173/login > /tmp/login.html
          grep -q 'property="og:title"' /tmp/login.html
          grep -q 'rel="manifest"' /tmp/login.html
