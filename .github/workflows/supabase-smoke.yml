name: KREISLAUF – Datenbanktests (lokal + optionales Testprojekt)

on:
  workflow_dispatch:
  push:
    branches:
      - demo/local-auth-off
    paths:
      - .github/workflows/supabase-smoke.yml
      - package.json
      - package-lock.json
      - scripts/db-migrations.test.mjs
      - scripts/supabase-setup-postgres.test.mjs
      - scripts/supabase-setup.test.mjs
      - scripts/supabase-db-smoke.mjs
      - scripts/supabase-test-project-verify.mjs
      - SUPABASE-SETUP.sql
      - migrations/**

permissions:
  contents: read

jobs:
  local-database-test:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          ref: demo/local-auth-off
      - name: Node.js einrichten
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Abhängigkeiten installieren und Lockfile abgleichen
        run: npm install --no-audit --no-fund --fetch-retries=1 --fetch-timeout=30000
      - name: Syntax der optionalen Supabase-Prüfung validieren
        run: node --check scripts/supabase-test-project-verify.mjs
      - name: PostgreSQL-Migrationen in temporärer Testdatenbank prüfen
        run: node --test scripts/db-migrations.test.mjs scripts/supabase-setup-postgres.test.mjs scripts/supabase-setup.test.mjs

      - name: Supabase-Testprojekt (read-only)
        env:
          SUPABASE_TEST_DATABASE_URL: ${{ secrets.SUPABASE_TEST_DATABASE_URL }}
        run: |
          if [ -z "$SUPABASE_TEST_DATABASE_URL" ]; then
            echo "::notice::SUPABASE_TEST_DATABASE_URL fehlt; der externe Testprojekt-Check wird übersprungen."
            exit 0
          fi
          node scripts/supabase-test-project-verify.mjs
